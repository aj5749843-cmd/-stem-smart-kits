<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>معامل STEM الذكية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: full-screen 3D lab room (shelves of kits) → 3D workbench per kit; HTML HUD floats over the scene */
  --ink:#13222a; --muted:#5a6c75; --glass:rgba(255,255,255,.9); --line:rgba(19,34,42,.12);
  --accent:#0d7a8a; --sens:#11857a; --act:#c4621a; --ok:#1e8a4b; --bad:#c03838; --warn:#b97300;
  --kit:#0d7a8a; --chipbg:rgba(19,34,42,.06);
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#cfd9dd;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.3;text-wrap:balance}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;z-index:5}
.card{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(10,30,40,.14)}
.top{top:12px;inset-inline:12px;display:flex;align-items:center;gap:12px;padding:8px 14px}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.brand b{font-family:var(--f-display);font-size:17px;display:block;line-height:1.2}
.brand small{color:var(--muted);font-size:12px}
.sp{flex:1}
.score{font-size:13px;color:var(--muted);white-space:nowrap}
.score b{color:var(--ink);font-family:var(--f-mono)}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 13px;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--kit)}
.btn.primary{background:var(--kit);border-color:var(--kit);color:#fff}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.status{font-size:12.5px;display:inline-flex;align-items:center;gap:6px;color:var(--muted);white-space:nowrap}
.status i{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.status.live i{background:var(--ok);box-shadow:0 0 0 4px rgba(30,138,75,.25)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;background:var(--chipbg);color:var(--muted);font-size:12px;white-space:nowrap}
.chip.ok{background:rgba(30,138,75,.14);color:var(--ok)}

/* room hud */
#roomHud .dock{bottom:12px;left:12px;right:12px;margin-inline:auto;width:fit-content;padding:8px 10px;display:grid;gap:6px;max-width:calc(100vw - 24px)}
.dock-hint{margin:0;font-size:12.5px;color:var(--muted);text-align:center}
.dock-hint b{color:var(--ink);font-family:var(--f-display);margin-inline-end:6px}
.dock-row{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
.dock-row .kchip{padding:4px 9px;font-size:12.5px;gap:6px}
.dock-row .kchip .chip{padding:0 6px;font-size:11px}
.kchip{flex:none}
.kchip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:5px 10px;font-size:13px}
.kchip i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.kchip:hover{border-color:var(--c)}
.tip{position:fixed;z-index:8;pointer-events:none;padding:10px 12px;max-width:280px;opacity:0;transition:opacity .12s}
.tip.show{opacity:1}
.tip .en{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--c)}
.tip b{display:block;font-family:var(--f-display);font-size:16px}
.tip p{margin:4px 0 6px;font-size:12.5px;color:var(--muted)}
.tip .go{font-size:12px;color:var(--c);font-weight:600}

/* kit hud */
#kitHud .top .ktitle{display:flex;align-items:center;gap:10px;min-width:0}
.kic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--kit);color:#fff;flex:none}
.ktitle small{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--kit);letter-spacing:.06em}
.ktitle h1{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel{top:76px;inset-inline-start:12px;bottom:12px;width:380px;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:6px 6px 0;overflow-x:auto;flex:none}
.tabs button{border:0;background:transparent;padding:8px 10px;font-size:13.5px;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--kit);font-weight:600}
.pane{padding:14px;overflow:auto;display:grid;gap:12px;align-content:start;flex:1}
.pane-intro{margin:0;color:var(--muted);font-size:13px}
.note{font-size:12px;color:var(--muted);margin:0}
.sensors{bottom:12px;inset-inline-end:12px;width:300px;padding:12px;display:grid;gap:10px;max-height:44vh;overflow:auto}
.sensors h3{font-size:14px;display:flex;justify-content:space-between;align-items:center}
.sens{display:grid;gap:2px}
.sens label{display:flex;justify-content:space-between;font-size:13px;font-weight:500;gap:8px}
.sens label span{font-family:var(--f-mono);color:var(--sens);direction:ltr}
.sens input{width:100%;accent-color:var(--sens)}
.tog{border:1px solid var(--line);border-radius:8px;background:#fff;padding:4px 10px;font-size:13px}
.tog.on{background:var(--sens);border-color:var(--sens);color:#fff}
.viewhint{position:fixed;z-index:4;bottom:14px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--muted);padding:5px 12px;white-space:nowrap}
.pop{position:fixed;z-index:9;width:230px;padding:12px;display:none;gap:8px;transform:translate(-50%,calc(-100% - 18px))}
.pop.show{display:grid}
.pop b{font-family:var(--f-display);font-size:15px}
.pop .m{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.pop .row{display:flex;gap:6px;flex-wrap:wrap}
/* tools list */
.tools{display:grid;gap:6px}
.tools h4{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.tools h4::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--tc)}
.ti{display:flex;justify-content:space-between;align-items:center;gap:6px;width:100%;text-align:start;border:1px solid var(--line);border-inline-start:3px solid var(--tc);background:#fff;border-radius:8px;padding:6px 9px;font-size:13.5px}
.ti:disabled{opacity:.55;cursor:default}
.ti span:last-child{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.ti .ok{font-family:var(--f-body)!important;color:var(--ok)!important;font-size:11.5px!important}
.tS{--tc:var(--sens)} .tA{--tc:var(--act)}
/* rules */
.rule{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px;background:#fff}
.rule-h{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.rule-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.kw{font-family:var(--f-display);font-weight:600;font-size:13px;padding:3px 9px;border-radius:7px;background:var(--sens);color:#fff}
.kw.then{background:var(--act)}
.rule select,.rule input{border:1px solid var(--line);border-radius:8px;background:#fff;padding:4px 6px;font-size:13px;max-width:100%}
.rule input[type=number]{width:80px;font-family:var(--f-mono)}
.rule input[type=text]{width:130px}
.warn{font-size:12px;color:var(--warn)}
.linkbtn{border:0;background:transparent;color:var(--bad);font-size:12.5px;padding:0}
/* projects */
.proj{border:1px solid var(--line);border-radius:12px;background:#fff}
.proj.done{border-color:rgba(30,138,75,.45)}
.proj summary{list-style:none;display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}
.proj summary::-webkit-details-marker{display:none}
.pnum{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--kit);color:#fff;font-family:var(--f-mono);font-size:13px;flex:none}
.proj.done .pnum{background:var(--ok)}
.ptitle{flex:1;font-weight:600;font-size:14px}
.pbody{padding:0 12px 12px;display:grid;gap:9px}
.goal{margin:0;font-size:13.5px}
.parts{display:flex;flex-wrap:wrap;gap:5px}
.steps{margin:0;padding-inline-start:20px;font-size:13px;color:var(--muted);display:grid;gap:3px}
.pbtns{display:flex;gap:8px;flex-wrap:wrap}
.result{font-size:13px;border-radius:9px;padding:8px 10px}
.result.ok{background:rgba(30,138,75,.13);color:var(--ok)}
.result.bad{background:rgba(192,56,56,.1);color:var(--bad)}
.result:empty{display:none}
/* data */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
.tile small{color:var(--muted);font-size:11.5px;display:block}
.tile b{font-family:var(--f-mono);font-size:18px;direction:ltr;display:block;text-align:end}
.spark{width:100%;height:32px;display:block}
.spark polyline{fill:none;stroke:var(--sens);stroke-width:2;vector-effect:non-scaling-stroke}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.feed,.log{font-family:var(--f-mono);font-size:11.5px;background:#0b1a1f;color:#a6e6dc;border-radius:10px;padding:10px;max-height:200px;overflow:auto;white-space:pre-wrap;unicode-bidi:plaintext}
.feed{direction:ltr;text-align:left}
pre.code{margin:0;font-family:var(--f-mono);font-size:12px;line-height:1.55;background:#0b1a1f;color:#d9f0f2;border-radius:10px;padding:12px;direction:ltr;text-align:left;overflow:auto}
/* arm */
.ctl{display:grid;gap:4px}
.ctl label{display:flex;justify-content:space-between;font-size:13.5px;font-weight:500}
.ctl label span{font-family:var(--f-mono);color:var(--kit);direction:ltr}
.ctl input{width:100%;accent-color:var(--kit)}
.poses{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.poses th,.poses td{border-bottom:1px solid var(--line);padding:4px;text-align:center}
.poses th{color:var(--muted);font-weight:500}
.poses tr.cur td{background:rgba(60,110,150,.14)}
.toast{position:fixed;bottom:64px;left:50%;transform:translateX(-50%) translateY(16px);background:#13222a;color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{position:fixed;inset:0;display:grid;place-items:center;z-index:30;background:#cfd9dd;font-family:var(--f-display);font-size:18px;color:var(--muted);transition:opacity .5s}
.loading.hide{opacity:0;pointer-events:none}
[hidden]{display:none!important}
@media (max-width:860px){
  .panel{top:auto;bottom:0;inset-inline:0;width:auto;height:46vh;border-radius:16px 16px 0 0}
  .sensors{bottom:calc(46vh + 8px);inset-inline-end:8px;width:240px;max-height:28vh}
  .score,.brand small{display:none}
  .viewhint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="gl" aria-label="معمل ثلاثي الأبعاد"></canvas>
<div class="loading" id="loading">جارٍ تجهيز المعمل…</div>

<div id="roomHud">
  <header class="hud top card">
    <div class="brand"><span class="mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/><path d="M7.5 14h9"/></svg></span>
    <span><b>معامل STEM الذكية</b><small>معمل افتراضي ثلاثي الأبعاد</small></span></div>
    <span class="sp"></span><span class="score" id="score1"></span>
  </header>
  <div class="hud dock card"><p class="dock-hint"><b>اختر حقيبة من الرف</b> انقرها لتُفتح · اسحب لتدوير المعمل</p><div class="dock-row" id="kitChips"></div></div>
</div>

<div id="kitHud" hidden>
  <header class="hud top card">
    <button class="btn" id="back">→ إلى المعمل</button>
    <div class="ktitle"><span class="kic" id="kic"></span><div style="min-width:0"><small id="ken"></small><h1 id="kar"></h1></div></div>
    <span class="sp"></span>
    <span class="status" id="status"><i></i><span>المحاكاة متوقفة</span></span>
    <button class="btn primary" id="run">▶ تشغيل المحاكاة</button>
    <button class="btn" id="armReset" hidden>أعد المشهد</button>
    <button class="btn" id="resetView" title="إعادة زاوية الكاميرا">الزاوية الأصلية</button>
  </header>
  <aside class="hud panel card"><div class="tabs" role="tablist" id="tabs"></div><div class="pane" id="pane"></div></aside>
  <div class="hud sensors card" id="sensors" hidden></div>
  <div class="viewhint card" id="viewhint">انقر قطعة داخل الحقيبة لإضافتها · انقر قطعة على الطاولة لتوصيلها · اسحب لتدوير المشهد</div>
</div>
<div class="tip card" id="tip"></div>
<div class="pop card" id="pop"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* =================== helpers =================== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,k)=>a+(b-a)*k;
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3200)}
const AR='"IBM Plex Sans Arabic","Readex Pro",Tahoma,Arial,sans-serif';

/* =================== data =================== */
function S(n,m,u,min,max,st,d,v){return{n,m,t:'s',u,min,max,st,d,v}}
function B(n,m,on,off,v){return{n,m,t:'s',b:1,on,off,min:0,max:1,st:1,d:0,v}}
function A(n,m,k,viz,v,col){return{n,m,t:'a',k,viz,v,col}}
const C={
  ultrasonic:S('حساس المسافة','HC-SR04','سم',2,400,1,150,'distance'),
  ldr:S('حساس الضوء','LDR','%',0,100,1,70,'light'),
  pir:B('حساس الحركة','PIR','توجد حركة','لا حركة','motion'),
  sound:S('حساس الصوت','KY-037','dB',30,120,1,45,'noise'),
  temp:S('حساس الحرارة','DHT22','°C',-10,60,0.5,25,'temperature'),
  hum:S('حساس الرطوبة','DHT22-H','%',0,100,1,40,'humidity'),
  gas:S('حساس الغاز','MQ-135','ppm',0,1000,10,150,'gas'),
  rain:S('حساس المطر','FC-37','%',0,100,1,0,'rain'),
  pulse:S('حساس نبض القلب','MAX30102','نبضة/د',40,180,1,75,'heartRate'),
  btemp:S('حساس حرارة الجسم','MLX90614','°C',34,42,0.1,36.8,'bodyTemp'),
  spo2:S('حساس الأكسجين','SpO2','%',80,100,1,98,'spo2'),
  fall:S('حساس السقوط','MPU6050','g',0,4,0.1,1,'accel'),
  button:B('زر الطوارئ','Push Button','مضغوط','غير مضغوط','sosButton'),
  soil:S('رطوبة التربة','YL-69','%',0,100,1,60,'soil'),
  water:S('مستوى الماء','Water Level','%',0,100,1,70,'waterLevel'),
  ph:S('حساس الحموضة','pH Probe','pH',0,14,0.1,7,'ph'),
  flame:B('حساس اللهب','IR Flame','يوجد لهب','آمن','flame'),
  door:B('حساس الباب','Reed Switch','مفتوح','مغلق','door'),
  touch:B('حساس اللمس','TTP223','لمس','بدون لمس','touch'),
  hall:S('حساس المغناطيس','Hall A3144','mT',0,100,1,5,'magnet'),
  led:A('مصباح LED','LED 5mm','onoff','led','led','#ffc21a'),
  redled:A('مؤشر أحمر','LED Red','onoff','led','alertLed','#ff3b3b'),
  growled:A('إضاءة النمو','Grow LED','onoff','led','growLight','#d04bff'),
  buzzer:A('جرس إنذار','Buzzer','onoff','buzzer','buzzer'),
  fan:A('مروحة','DC Fan','onoff','fan','fan'),
  pump:A('مضخة ماء','Pump 5V','onoff','pump','pump'),
  relay:A('مرحّل ومصباح','Relay + Lamp','onoff','bulb','lamp'),
  vib:A('محرك اهتزاز','Vibration','onoff','vib','vibration'),
  servo:A('محرك سيرفو','SG90','servo','servo','servo'),
  lcd:A('شاشة LCD','LCD 16x2','lcd','lcd','lcd'),
  traffic:A('إشارة مرور','Traffic LED','traffic','traffic','traffic'),
  cloud:A('وحدة السحابة','Wi-Fi IoT','cloud','cloud','cloud')
};
const dec=st=>st<1?1:0;
function fmt(id,v){const c=C[id];if(c.b)return v?c.on:c.off;return (+v).toFixed(dec(c.st))+' '+c.u}

const circ=(cx,cy,r)=>`M${cx-r} ${cy}a${r} ${r} 0 1 0 ${2*r} 0a${r} ${r} 0 1 0 ${-2*r} 0`;
const IC={
 city:['M3 21V10l5-3v14M8 21V4h8v17M16 21v-9h5v9M2 21h20M11 8h2M11 12h2M11 16h2'],
 climate:['M12 14.6V5a2 2 0 1 0-4 0v9.6a4 4 0 1 0 4 0z','M10 11v6','M15 6a3 3 0 0 1 5 2.5M16 13h5'],
 health:['M20.8 6.6a5 5 0 0 0-8.8-2.2 5 5 0 0 0-8.8 2.2C2.4 11 12 20 12 20s9.6-9 8.8-13.4z','M3 12h4l2-3 3 6 2-3h7'],
 agri:['M12 21v-9','M12 12C12 7 8 5 4 5c0 5 3 7 8 7z','M12 14c0-4 3-6 8-6 0 4-3 6-8 6z','M5 21h14'],
 home:['M3 11l9-7 9 7v10H3z','M9 21v-6h6v6'],
 science:['M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3','M7.5 14h9'],
 arm:['M3 21h10M8 21v-3',circ(8,16,2),'M9.5 14.5L14 8',circ(14.6,7,1.6),'M16 6l4 .5M16 8l3 3']
};
const icon=(id,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[id].map(d=>`<path d="${d}"/>`).join('')}</svg>`;

const KITS=[
{id:'city',en:'SMART CITY KIT',ar:'حقيبة المدينة الذكية',col:'#2f6fd6',desc:'إنارة الشوارع، بوابات المواقف، إشارات المشاة ومراقبة الضوضاء.',

function drawLcd(L,txt){if(L.last===txt)return;L.last=txt;const x=L.x;x.fillStyle=txt?'#a5d145':'#4f5f2a';x.fillRect(0,0,256,128);if(txt){x.fillStyle='#1d2e05';x.direction='rtl';x.textAlign='center';x.font=`700 30px ${AR}`;const parts=String(txt).split(': ');x.fillText(parts[0],128,52);if(parts[1]){x.direction='ltr';x.font='700 34px "IBM Plex Mono",monospace';x.fillText(parts[1],128,100)}}L.t.needsUpdate=true}
function animateBench(dt,t){
  for(const id in modObjs){const c=C[id];if(c.t!=='a')continue;const U=modObjs[id].userData.u,st=actState[id]??defState(c.k);
    const on=c.k==='onoff'?st===true:false;
    if(U.glow&&c.k==='onoff'){U.glow.forEach(m=>m.emissiveIntensity=on?2.2:.05);if(U.light)U.light.intensity=on?1.6:0}
    if(U.ring){U.ring.material.opacity=on?(1-(t*2%1)):0;const sc=1+(t*2%1)*1.2;U.ring.scale.set(sc,sc,sc)}
    if(U.spin&&on)U.spin.rotation.y+=dt*16;
    if(U.drops)U.drops.forEach((d,i)=>{d.visible=on;if(on){const k=(t*1.6+i/5)%1;d.position.y=.7-k*.65;d.position.x=.45+k*.25}});
    if(U.shake){U.shake.position.x=on?Math.sin(t*90)*.04:0}
    if(U.horn){const tg=-(st||0)*Math.PI/180;U.horn.rotation.y=lerp(U.horn.rotation.y,tg,.12)}
    if(U.lcd)drawLcd(U.lcd,st&&st.text?st.text:(st?' ':null));
    if(U.tl){for(const k in U.tl)U.tl[k].emissiveIntensity=(st===k)?2.4:.08}
    if(U.cloud){U.cloud.position.y=1.3+Math.sin(t*2)*.08;U.glow[0].emissiveIntensity=st?.6:0;U.packets.forEach((q,i)=>{q.visible=!!st;if(st){const k=(t*.9+i/3)%1;q.position.y=.3+k*.9;q.rotation.y=t*3}})}
  }
  for(const id in modObjs){const U=modObjs[id].userData.u;if(U.btn){U.btn.position.y=build.placed[id].val?.15:.2}}
  wireObjs.forEach(w=>w.pulses.forEach((q,i)=>{q.visible=running;if(running){let k=(t*.7+i/3)%1;if(!w.s)k=1-k;q.position.copy(w.curve.getPoint(k))}}));
  if(dio)dio.update(dt,t);
}

/* -------- kit click & popover -------- */
function onKitClick(o,e){
  if(kit.id==='arm')return;
  if(!o){closePop();return}
  const id=o.userData.pick;
  if(o.userData.caseItem){addComp(id);return}
  if(o.userData.benchItem){openPop(id)}
}
function openPop(id){popId=id;renderPop();$('#pop').classList.add('show');placePop()}
function closePop(){popId=null;$('#pop').classList.remove('show')}
function placePop(){const m=modObjs[popId];if(!m){closePop();return}const v=new THREE.Vector3();m.getWorldPosition(v);v.y+=.4;v.project(cam);const p=$('#pop');p.style.left=((v.x+1)/2*innerWidth)+'px';p.style.top=((1-v.y)/2*innerHeight)+'px'}
function renderPop(){const id=popId,c=C[id],p=build.placed[id];
  $('#pop').innerHTML=`<div><b>${c.n}</b><div class="m" dir="ltr">${c.m}</div></div><div class="note">${p.port?`موصول بالمنفذ <b class="mono">${p.port}</b> في لوحة ESP32`:'غير موصول بلوحة التحكم، لن يعمل في المحاكاة.'}</div>
  <div class="row"><button class="btn primary" data-pa="wire">${p.port?'فصل السلك':'توصيل بلوحة التحكم'}</button><button class="btn danger" data-pa="rm">إعادة للحقيبة</button></div>`}
$('#pop').onclick=e=>{const a=e.target.closest('[data-pa]');if(!a)return;const id=popId;if(a.dataset.pa==='wire'){toggleWire(id);renderPop()}else{removeComp(id);closePop()}};
function addComp(id){
  if(build.placed[id])return;
  const same=Object.keys(build.placed).filter(i=>C[i].t===C[id].t).length;if(same>=6){toast('امتلأت أماكن هذا النوع على الطاولة. أعد قطعة إلى الحقيبة أولًا.');return}
  build.placed[id]={val:C[id].d,port:null};save();
  // fly animation from case to slot
  const from=new THREE.Vector3();const ci=caseItems.children.find(m=>m.userData.pick===id);if(ci)ci.getWorldPosition(from);
  refreshCaseItems();refreshBench();const m=modObjs[id];const to=m.position.clone();
  if(ci){m.position.copy(from);m.scale.setScalar(.62);tween(650,e=>{m.position.lerpVectors(from,to,e);m.position.y+=Math.sin(e*Math.PI)*2;m.scale.setScalar(.62+.38*e)})}
  afterChange();toast(`أُضيف «${C[id].n}» إلى الطاولة. انقره لتوصيله بلوحة التحكم.`);
}
function removeComp(id){delete build.placed[id];build.rules=build.rules.filter(r=>r.s!==id&&r.a!==id);save();refreshCaseItems();refreshBench();afterChange()}
function toggleWire(id){const p=build.placed[id];
  if(p.port){p.port=null}else{const list=C[id].t==='s'?PORTS_A:PORTS_D;const used=Object.values(build.placed).map(q=>q.port);const f=list.find(x=>!used.includes(x));if(!f){toast('لا توجد منافذ فارغة.');return}p.port=f;toast(`وُصل «${C[id].n}» بالمنفذ ${f}`)}
  save();refreshBench();afterChange()}
function afterChange(){renderSensors();if(['projects','rules','code','tools'].includes(tab))renderPane();if(running)actState=evaluate(vals())}

/* -------- sensors card -------- */
function renderSensors(){
  const el=$('#sensors');if(!kit||kit.id==='arm'){el.hidden=true;return}
  const ss=Object.keys(build.placed).filter(i=>C[i].t==='s');if(!ss.length){el.hidden=true;return}el.hidden=false;
  el.innerHTML=`<h3>قراءات البيئة <span class="note">غيّرها لتجرّب</span></h3>`+ss.map(id=>{const c=C[id],v=build.placed[id].val;
    return c.b?`<div class="sens"><label>${c.n}</label><button class="tog ${v?'on':''}" data-tog="${id}">${fmt(id,v)}</button></div>`
    :`<div class="sens"><label for="r-${id}">${c.n}<span id="rv-${id}">${fmt(id,v)}</span></label><input type="range" id="r-${id}" data-rng="${id}" min="${c.min}" max="${c.max}" step="${c.st}" value="${v}"></div>`}).join('');
}
$('#sensors').oninput=e=>{const id=e.target.dataset.rng;if(!id)return;build.placed[id].val=+e.target.value;$('#rv-'+id).textContent=fmt(id,build.placed[id].val);save()};
$('#sensors').onclick=e=>{const id=e.target.dataset.tog;if(!id)return;const p=build.placed[id];p.val=p.val?0:1;e.target.classList.toggle('on',!!p.val);e.target.textContent=fmt(id,p.val);save()};

/* =================== ENGINE =================== */
function vals(){const o={};for(const id in build.placed)if(C[id].t==='s')o[id]=build.placed[id].val;return o}
function defState(k){return k==='onoff'?false:k==='servo'?0:k==='traffic'?'red':null}
function evaluate(v){
  const st={},P=build.placed;for(const id in P)if(C[id].t==='a')st[id]=defState(C[id].k);
  for(const r of build.rules){if(!P[r.s]||!P[r.a]||!P[r.s].port||!P[r.a].port)continue;const x=v[r.s],t=+r.t;
    const ok=r.op==='always'||(r.op==='>'&&x>t)||(r.op==='<'&&x<t)||(r.op==='='&&Math.abs(x-t)<1e-6);if(!ok)continue;const k=C[r.a].k;
    if(k==='onoff')st[r.a]=true;else if(k==='servo')st[r.a]=clamp(+r.p||0,0,180);else if(k==='traffic')st[r.a]=r.p||'green';
    else if(k==='lcd')st[r.a]=r.act==='msg'?{text:r.p||'',src:null}:{text:C[r.s].n.replace('حساس ','')+': '+fmt(r.s,x),src:r.s};
    else if(k==='cloud')st[r.a]={src:r.s,val:x}}
  return st}
function isActive(a,st,s){const k=C[a].k,x=st[a];if(k==='onoff')return x===true;if(k==='servo')return x>=45;if(k==='traffic')return x==='green';return !!x&&x.src===s}
const TL={red:'أحمر',yellow:'أصفر',green:'أخضر'};
function stateText(a,x){const k=C[a].k;if(k==='onoff')return x?'يعمل':'متوقف';if(k==='servo')return x+'°';if(k==='traffic')return TL[x];if(k==='lcd')return x?'«'+x.text+'»':'فارغة';return x?'يرسل':'لا إرسال'}
function startSim(){running=true;t0=Date.now();tickN=0;$('#run').textContent='■ إيقاف المحاكاة';const s=$('#status');s.classList.add('live');s.lastElementChild.textContent='المحاكاة تعمل';tick();timer=setInterval(tick,250)}
function stopSim(){if(!running)return;running=false;clearInterval(timer);actState={};$('#run').textContent='▶ تشغيل المحاكاة';const s=$('#status');s.classList.remove('live');s.lastElementChild.textContent='المحاكاة متوقفة';if(tab==='data')renderPane()}
$('#run').onclick=()=>running?stopSim():startSim();
function tick(){tickN++;const v=vals();actState=evaluate(v);
  for(const id in v){(hist[id]=hist[id]||[]).push(v[id]);if(hist[id].length>60)hist[id].shift()}

/* =================== ROBOTIC ARM =================== */
const AW=820,G=500,SH={x:140,y:460},L1=210,L2=200,L3=60,SC=.016;
const ZONES=[{c:'green',x1:370,x2:430,n:'الخضراء'},{c:'red',x1:440,x2:500,n:'الحمراء'},{c:'blue',x1:510,x2:570,n:'الزرقاء'}];

const RAD=Math.PI/180;

function armResetScene(){arm={a1:115,a2:-75,a3:-50,grip:false};held=null;blocks=[{c:'red',x:235,y:G-15,vy:0},{c:'blue',x:280,y:G-15,vy:0},{c:'green',x:325,y:G-15,vy:0}];if(armParts)armParts.blocks.forEach((m,i)=>m.userData.b=blocks[i])}
function fk(a=arm){const t1=a.a1*RAD,t2=(a.a1+a.a2)*RAD,t3=(a.a1+a.a2+a.a3)*RAD;const E={x:SH.x+L1*Math.cos(t1),y:SH.y-L1*Math.sin(t1)},W={x:E.x+L2*Math.cos(t2),y:E.y-L2*Math.sin(t2)},T={x:W.x+L3*Math.cos(t3),y:W.y-L3*Math.sin(t3)};return{E,W,T,t1,t2,t3}}
function ik(x,y){const wx=x,wy=y-L3,dx=wx-SH.x,dy=SH.y-wy;let d=clamp(Math.hypot(dx,dy),Math.abs(L1-L2)+1,L1+L2-.5);const g=Math.acos((L1*L1+L2*L2-d*d)/(2*L1*L2))/RAD,b=Math.acos((L1*L1+d*d-L2*L2)/(2*L1*d))/RAD;const a1=Math.atan2(dy,dx)/RAD+b,a2=-(180-g),a3=-90-a1-a2;return{a1:Math.round(clamp(a1,0,180)),a2:Math.round(clamp(a2,-160,160)),a3:Math.round(clamp(a3,-150,150))}}
function zoneOf(b){if(b===held||b.vy)return null;const z=ZONES.find(z=>b.x>=z.x1&&b.x<=z.x2);return z?z.c:null}
function setGrip(c){arm.grip=c;const T=fk().T;if(c&&!held){let best=null,bd=30;blocks.forEach(b=>{const d=Math.hypot(b.x-T.x,b.y-T.y);if(d<bd){bd=d;best=b}});if(best){held=best;best.vy=0}}else if(!c&&held){held.vy=.01;held=null}}
function restY(b){let r=G-15;blocks.forEach(o=>{if(o!==b&&o!==held&&Math.abs(o.x-b.x)<28&&o.y>b.y-1)r=Math.min(r,o.y-30)});return r}
function onLand(b){const z=zoneOf(b);if(z===b.c){toast(`وُضع المكعب في المنطقة ${ZONES.find(q=>q.c===z).n}`);if(playing&&build.poses.length>=4)complete('r3')}
  const g=blocks.find(x=>x.c==='green');if(zoneOf(g)==='green')complete('r1');if(zoneOf(blocks[0])==='red'&&zoneOf(blocks[1])==='blue')complete('r2');if(tab==='projects')renderPane()}
function armCheck(id){const g=blocks.find(x=>x.c==='green');
  if(id==='r1')return zoneOf(g)==='green'?[1,'المكعب الأخضر داخل المنطقة الخضراء. أحسنت!']:[0,'المكعب الأخضر ليس في المنطقة الخضراء بعد.'];
  if(id==='r2'){const r=zoneOf(blocks[0])==='red',b=zoneOf(blocks[1])==='blue';return r&&b?[1,'المكعبان في منطقتيهما الصحيحتين. أحسنت!']:[0,(r?'':'المكعب الأحمر ليس في المنطقة الحمراء. ')+(b?'':'المكعب الأزرق ليس في المنطقة الزرقاء.')]}
  if(build.poses.length<4)return[0,`سجّلت ${build.poses.length} وضعيات فقط. تحتاج 4 وضعيات على الأقل.`];
  return store.done.r3?[1,'نفّذت الذراع التسلسل بنجاح.']:[0,'شغّل التسلسل بحيث يضع مكعبًا في منطقة لونه أثناء التشغيل.']}
function buildArmScene(){
  const s=baseKitScene();kitScene=s;pickables=[];frameFns=[];
  // zones
  ZONES.forEach(z=>{const a=P3(z.x1,G),b=P3(z.x2,G);const m=box(b.x-a.x,.03,2.0,M(BC[z.c],{transparent:true,opacity:.55}),(a.x+b.x)/2,.02,0);m.castShadow=false;s.add(m);const l=label(z.n.replace('ال',''),null,{scale:.85,fs:60,bar:BC[z.c]});l.position.set((a.x+b.x)/2,.35,1.4);s.add(l)});
  const blue=M('#2a63c9',{roughness:.4}),white=M('#f2f4f5',{roughness:.35}),dark=M('#1d272c',{roughness:.45}),kc=M(kit.col,{roughness:.4});
  const base=P3(SH.x,G);
  s.add(cyl(.95,1.1,.3,dark,base.x,.15,0,40));s.add(cyl(.7,.8,.5,kc,base.x,.55,0,40));s.add(box(.8,.5,.7,blue,base.x,.55,0));
  const mk=()=>{const g=new THREE.Group();s.add(g);return g};
  const link1=mk(),link2=mk(),palm=mk(),f1=mk(),f2=mk();
  link1.add(box(1,.34,.42,white,0,0,0));link1.add(box(1,.08,.46,kc,0,.2,0));link2.add(box(1,.28,.36,white,0,0,0));link2.add(box(1,.07,.4,kc,0,.17,0));
  palm.add(box(.18,.75,.42,dark,0,0,0));f1.add(box(1,.07,.3,M('#3a4a52'),0,0,0));f2.add(box(1,.07,.3,M('#3a4a52'),0,0,0));
  const jS=cyl(.3,.3,.6,blue,0,0,0),jE=cyl(.25,.25,.5,blue,0,0,0),jW=cyl(.2,.2,.46,blue,0,0,0);[jS,jE,jW].forEach(j=>{j.rotation.x=Math.PI/2;s.add(j)});
  const tip=sph(.07,M('#2fa84f',{emissive:'#2fa84f',emissiveIntensity:.8}),0,0,0);s.add(tip);
  const blocksM=blocks?null:null;armResetScene();
  const bm=blocks.map(b=>{const m=box(30*SC,30*SC,30*SC,M(BC[b.c],{roughness:.4}),0,0,0);m.userData.b=b;s.add(m);return m});
  // servo labels
  const lbs=[['سيرفو الكتف · D1'],['سيرفو الكوع · D2'],['سيرفو الرسغ · D3']].map(([t])=>{const l=label(t,null,{scale:1.25,fs:46,bar:kit.col});s.add(l);return l});
  armParts={blocks:bm};
  const place=(g,a,b,thick)=>{const v=b.clone().sub(a);g.position.copy(a).add(b).multiplyScalar(.5);g.scale.set(v.length(),1,1);g.rotation.set(0,0,Math.atan2(v.y,v.x))};
  frameFns.push((dt,t)=>{
    if(anim){const k=clamp((performance.now()-anim.t)/anim.dur,0,1),e=ease(k);['a1','a2','a3'].forEach(j=>arm[j]=Math.round(anim.from[j]+(anim.to[j]-anim.from[j])*e));syncArmUI();
      if(k>=1){const p=anim.to;anim=null;setGrip(p.grip);syncArmUI();setTimeout(()=>{if(playing){playIdx++;goPose()}},250)}}
    const F=fk(),S3=P3(SH.x,SH.y),E3=P3(F.E.x,F.E.y),W3=P3(F.W.x,F.W.y),T3=P3(F.T.x,F.T.y);
    place(link1,S3,E3);place(link2,E3,W3);jS.position.copy(S3);jE.position.copy(E3);jW.position.copy(W3);
    palm.position.copy(W3);palm.rotation.set(0,0,F.t3);
    const ux=Math.cos(F.t3),uy=Math.sin(F.t3),px=-uy,py=ux;const op=(held?15:arm.grip?8:22)*SC;
    [[f1,1],[f2,-1]].forEach(([f,sg])=>{const a=W3.clone().add(new THREE.Vector3(px*op*sg,py*op*sg,0)),b=T3.clone().add(new THREE.Vector3(px*op*sg+ux*.15,py*op*sg+uy*.15,0));place(f,a,b)});
    tip.position.copy(T3);tip.material.color.set(arm.grip?'#e5383b':'#2fa84f');tip.material.emissive.set(arm.grip?'#e5383b':'#2fa84f');
    lbs[0].position.copy(S3).add(new THREE.Vector3(0,.7,.6));lbs[1].position.copy(E3).add(new THREE.Vector3(0,.6,.6));lbs[2].position.copy(W3).add(new THREE.Vector3(0,.55,.6));
    if(held){held.x=F.T.x;held.y=F.T.y}
    blocks.forEach(b=>{if(b===held||!b.vy)return;const r=restY(b);b.vy+=.9;b.y+=b.vy;if(b.y>=r){b.y=r;b.vy=0;onLand(b)}});
    bm.forEach(m=>{const b=m.userData.b;m.position.copy(P3(b.x,b.y))});
  });
}
function armControlHTML(){const sl=(k,n,min,max)=>`<div class="ctl"><label for="s-${k}">${n}<span id="v-${k}">${arm[k]}°</span></label><input type="range" id="s-${k}" data-j="${k}" min="${min}" max="${max}" value="${arm[k]}"></div>`;
  return `<p class="pane-intro">حرّك المنزلقات لتغيير زاوية كل مفصل. قرّب الملقط (النقطة الخضراء) من المكعب ثم أغلقه لالتقاطه.</p>${sl('a1','سيرفو الكتف (D1)',0,180)}${sl('a2','سيرفو الكوع (D2)',-160,160)}${sl('a3','سيرفو الرسغ (D3)',-150,150)}
  <button class="btn primary" id="gripBtn">${arm.grip?'افتح الملقط (D4)':'أغلق الملقط (D4)'}</button><p class="note">يلتقط الملقط المكعب إذا كان طرفه على بعد أقل من 30 مم من مركز المكعب. تصبح النقطة حمراء عند إغلاق الملقط.</p>`}
function syncArmUI(){['a1','a2','a3'].forEach(k=>{const s=$('#s-'+k),v=$('#v-'+k);if(s)s.value=arm[k];if(v)v.textContent=arm[k]+'°'});const g=$('#gripBtn');if(g)g.textContent=arm.grip?'افتح الملقط (D4)':'أغلق الملقط (D4)'}
function bindArmControl(el){el.oninput=e=>{const j=e.target.dataset.j;if(!j||playing)return;arm[j]=+e.target.value;$('#v-'+j).textContent=arm[j]+'°'};el.onclick=e=>{if(e.target.id==='gripBtn'&&!playing){setGrip(!arm.grip);syncArmUI()}}}
function armProgramHTML(){const P=build.poses;
  return `<p class="pane-intro">ضع الذراع في وضعية من تبويب «التحكم» ثم اضغط «سجّل الوضعية». عند التشغيل تنتقل الذراع بين الوضعيات بالترتيب وتطبّق حالة الملقط.</p>
  <div class="pbtns"><button class="btn primary" id="recPose" ${playing?'disabled':''}>سجّل الوضعية الحالية</button><button class="btn" id="playSeq" ${P.length<2?'disabled':''}>${playing?'■ إيقاف':'▶ تشغيل التسلسل'}</button></div>
  ${P.length?`<table class="poses"><thead><tr><th>#</th><th>الكتف</th><th>الكوع</th><th>الرسغ</th><th>الملقط</th><th></th></tr></thead><tbody>${P.map((p,i)=>`<tr class="${playIdx===i?'cur':''}"><td>${i+1}</td><td dir="ltr">${p.a1}°</td><td dir="ltr">${p.a2}°</td><td dir="ltr">${p.a3}°</td><td>${p.grip?'مغلق':'مفتوح'}</td><td><button class="linkbtn" data-delpose="${i}" ${playing?'disabled':''}>حذف</button></td></tr>`).join('')}</tbody></table>`:'<p class="note">لا توجد وضعيات مسجّلة بعد.</p>'}
  <div class="pbtns"><button class="btn" id="exPose" ${playing?'disabled':''}>مثال: التقاط المكعب الأحمر ورفعه</button><button class="btn danger" id="clrPose" ${playing||!P.length?'disabled':''}>مسح التسلسل</button></div>
  <p class="note">المثال يلتقط المكعب ويرفعه فقط؛ أكمل الوضعيات لنقله إلى المنطقة الحمراء.</p>`}
function bindArmProgram(el){el.onclick=e=>{const id=e.target.id;
  if(id==='recPose'){build.poses.push({a1:arm.a1,a2:arm.a2,a3:arm.a3,grip:arm.grip});save();renderPane()}
  else if(id==='playSeq'){playing?stopArmPlay():playSeq()}else if(id==='clrPose'){build.poses=[];save();renderPane()}
  else if(id==='exPose'){const up=ik(235,420),dn=ik(235,G-15);build.poses=[{...up,grip:false},{...dn,grip:false},{...dn,grip:true},{...up,grip:true}];save();renderPane();toast('حُمّل مثال من 4 وضعيات')}
  const d=e.target.closest('[data-delpose]');if(d){build.poses.splice(+d.dataset.delpose,1);save();renderPane()}}}
function playSeq(){if(build.poses.length<2)return;playing=true;playIdx=0;goPose();renderPane()}
function stopArmPlay(){const was=playing;playing=false;playIdx=-1;anim=null;if(was&&kit&&kit.id==='arm')renderPane()}
function goPose(){if(!playing)return;if(playIdx>=build.poses.length){toast('انتهى تنفيذ التسلسل');stopArmPlay();return}anim={from:{a1:arm.a1,a2:arm.a2,a3:arm.a3},to:build.poses[playIdx],t:performance.now(),dur:700};if(tab==='program')renderPane()}
$('#armReset').onclick=()=>{stopArmPlay();armResetScene();syncArmUI();toast('أُعيد المشهد إلى وضعه الأول')};
function armCode(){const P=build.poses;const L=['// ROBOTIC ARM KIT — generated from your virtual lab','#include <ESP32Servo.h>','','Servo shoulder, elbow, wrist, gripper;','const int OPEN = 110, CLOSED = 40;',`const int N = ${Math.max(1,P.length)};`];
  L.push(P.length?`int poses[N][4] = {   // shoulder, elbow, wrist, grip\n${P.map(p=>`  {${p.a1}, ${p.a2}, ${p.a3}, ${p.grip?1:0}}`).join(',\n')}\n};`:'int poses[N][4] = {{115, -75, -50, 0}};   // record poses in the Programming tab');
  L.push('','void setup() {','  shoulder.attach(25);   // D1','  elbow.attach(26);      // D2','  wrist.attach(27);      // D3','  gripper.attach(14);    // D4','}','','void loop() {','  for (int i = 0; i < N; i++) {','    moveSmooth(poses[i][0], poses[i][1], poses[i][2], 700);','    gripper.write(poses[i][3] ? CLOSED : OPEN);','    delay(250);','  }','  delay(2000);','}');return L.join('\n')}

/* =================== START =================== */
(async()=>{
  try{await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,2500))]);await Promise.race([document.fonts.load(`700 40px "IBM Plex Sans Arabic"`),new Promise(r=>setTimeout(r,1500))])}catch(e){}
  buildRoom();renderScore();route();requestAnimationFrame(loop);
  setTimeout(()=>$('#loading').classList.add('hide'),150);
})();
